# Downloads the lake outline from OpenStreetMap and commits it.
# Run it manually from the Actions tab (or it runs when the script changes).
name: Fetch lake boundary

on:
  workflow_dispatch:
  push:
    paths:
      - "pipeline/fetch_boundary.py"
      - ".github/workflows/boundary.yml"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.fetch_boundary
      - name: Commit results
        run: |
          git config user.name "vadale-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lake.geojson data/lake_candidates.json data/lake_preview.png
          git diff --cached --quiet && exit 0
          git commit -m "Update lake boundary from OpenStreetMap"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
