# Checks that ESA's copy of the images (Copernicus Data Space) matches the
# Planetary Computer copy for the newest clear date. Prints a comparison in
# the log; changes nothing on the website.
# Run it by hand: Actions tab -> "Check second image source" -> Run workflow.
name: Check second image source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare ESA and Planetary Computer
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: python -m pipeline.cdse
